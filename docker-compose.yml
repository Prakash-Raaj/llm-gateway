services:
  # FastAPI app
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:              # wait until postgres and redis are healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./app:/code/app      # live code reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Postgres with pgvector
  postgres:
    image: pgvector/pgvector:pg17
    environment:             # only used on first startup
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql   # enables pgvector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis (cache / rate limiting)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Persistent data (removed only with `docker compose down -v`)
volumes:
  pgdata:
  redisdata:
