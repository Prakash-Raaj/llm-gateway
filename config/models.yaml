# Where each provider lives and how to authenticate
providers:
  ollama:
    type: ollama
    base_url_env: OLLAMA_BASE_URL
  groq:
    type: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  gemini:
    type: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
  mock:
    type: mock
    latency_ms: 300
  mock-fail:
    type: mock
    error_rate: 1.0
    error: rate_limit

# Model name the client sends -> which provider + that provider's real model ID
models:
  llama3.2:
    provider: ollama
    model: llama3.2
    input_price: 0
    output_price: 0
  groq-gpt-oss:
    provider: groq
    model: openai/gpt-oss-20b
    input_price: 0.075
    output_price: 0.30
  gemini-flash:
    provider: gemini
    model: gemini-3.5-flash-lite
    input_price: 0.30
    output_price: 2.50
  mock:
    provider: mock
    model: mock-model
    input_price: 1.0
    output_price: 2.0
  mock-fail:
    provider: mock-fail
    model: mock-model
